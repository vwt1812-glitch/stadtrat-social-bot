name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          check-latest: true
          cache: npm
      - name: Node-Sicherheitsstand prüfen
        run: |
          node --version
          node -e "const [major, minor, patch] = process.versions.node.split('.').map(Number); if (major !== 22 || minor < 23 || (minor === 23 && patch < 4)) process.exit(1)"
      - run: npm ci
      - name: FFmpeg und FFprobe als feste npm-Binärpakete bereitstellen
        timeout-minutes: 4
        run: |
          npm install --no-save --package-lock=false @ffmpeg-installer/linux-x64 @ffprobe-installer/linux-x64
          mkdir -p "$RUNNER_TEMP/media-bin"
          ln -s "$GITHUB_WORKSPACE/node_modules/@ffmpeg-installer/linux-x64/ffmpeg" "$RUNNER_TEMP/media-bin/ffmpeg"
          ln -s "$GITHUB_WORKSPACE/node_modules/@ffprobe-installer/linux-x64/ffprobe" "$RUNNER_TEMP/media-bin/ffprobe"
          echo "$RUNNER_TEMP/media-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/media-bin/ffmpeg" -hide_banner -encoders | grep libx264
      - run: npm test
