name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          check-latest: true
          cache: npm
      - name: Node-Sicherheitsstand prüfen
        run: |
          node --version
          node -e "const [major, minor, patch] = process.versions.node.split('.').map(Number); if (major !== 22 || minor < 23 || (minor === 23 && patch < 4)) process.exit(1)"
      - name: FFmpeg aus Paketcache installieren (ohne apt-get update)
        timeout-minutes: 4
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=25 install -y ffmpeg
          ffmpeg -hide_banner -version | head -n 1
          ffmpeg -hide_banner -encoders | grep libx264
      - run: npm ci
      - run: npm test
